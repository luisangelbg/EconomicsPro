<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>EconomicsPro · Manual de usuario</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../manual.css">
<style>
  .cover { background: #ffffff; }
  .cover text { font-kerning: normal; }
</style>
</head>
<body>

<section class="page cover" aria-label="Portada">
  <svg id="cover" viewBox="0 0 850 1100" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="Portada del manual de EconomicsPro: al centro, el flujo de efectivo de un proyecto agrícola año por año —la inversión hacia abajo, las cosechas hacia arriba tras la gestación, y el contorno de lo que vale cada una traída a hoy bajo la curva de descuento—; a los lados, aguacate, maíz, nopal, café, jitomate de invernadero y fresa, cada uno con su nombre científico; abajo, cuatro viñetas del programa: el perfil del valor actual neto con su tasa interna de retorno, el punto de equilibrio, la simulación de Monte Carlo y el puente del resultado privado al económico."></svg>
</section>

<script>
/* The cover is drawn once, deterministically (fixed seed), as vector graphics:
   it prints sharp at any size and every illustration is original. */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('cover');
  const el = (tag, attrs, parent, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    (parent || svg).appendChild(n);
    return n;
  };
  const rng = (seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(20260923);

  const W = 850, H = 1100;
  const INK = '#0e3b31', GRIS = '#5b6b63', BLANCO = '#ffffff';
  const VERDE = '#145e4e', AMBAR = '#b06e0c', ORO = '#dfa524';
  const HOJA = '#5a8f2b', CIELO = '#2d78b0', TIERRA = '#d0682a', ROSA = '#c0406a';
  const ENTRA = '#2f8f4a', SALE = '#c43a2f';
  const f1 = v => (+v).toFixed(2);
  const poly = pts => 'M' + pts.map(([x, y]) => f1(x) + ' ' + f1(y)).join('L');
  const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

  /* gradients are used only as fills of shapes with area (a gradient on a tspan or on the
     stroke of a straight line prints as a huge rectangle) */
  const defs = el('defs');
  const G = {};
  function grad(id, stops, attrs) {
    const g = el('radialGradient', Object.assign({ id }, attrs || {}), defs);
    stops.forEach(([o, c, a]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a == null ? 1 : a }, g));
    G[id] = `url(#${id})`;
  }
  grad('halo', [[0, '#eaf3ee', 1], [0.62, '#f4f8f5', 1], [1, '#ffffff', 0]]);
  grad('sol', [[0, '#fbeccd', 1], [1, '#fbeccd', 0]]);

  el('rect', { x: 0, y: 0, width: W, height: H, fill: BLANCO });

  /* ---------------------------------------------------------------- the colours of the ten blocks (plus preliminaries and appendices) */
  const BLOQUES = ['#0e3b31', '#145e4e', '#b06e0c', '#2d78b0', '#d0682a', '#5a8f2b', '#1d7a6f', '#c0406a', '#7b5ea7', '#8a6a4a', '#4b5a72', '#111111'];
  BLOQUES.forEach((c, i) => {
    el('rect', { x: f1(i * W / BLOQUES.length), y: 0, width: f1(W / BLOQUES.length + 0.5), height: 9, fill: c });
    el('rect', { x: f1(i * W / BLOQUES.length), y: H - 5, width: f1(W / BLOQUES.length + 0.5), height: 5, fill: c });
  });

  /* ---------------------------------------------------------------- title */
  const tb = el('g', { 'text-anchor': 'middle' });
  const t1 = el('text', { x: W / 2, y: 132, fill: INK, 'font-family': 'Cormorant, serif', 'font-size': 100, 'font-weight': 700, 'letter-spacing': 0.4 }, tb);
  el('tspan', {}, t1, 'Economics');
  el('tspan', { fill: VERDE, 'font-style': 'italic', 'font-weight': 600 }, t1, 'Pro');
  el('text', { x: W / 2, y: 210, fill: INK, 'font-family': 'Cormorant, serif', 'font-size': 50, 'font-weight': 600, 'letter-spacing': 0.8 }, tb, 'Manual de usuario');
  el('text', { x: W / 2, y: 254, fill: VERDE, 'font-family': 'Cormorant, serif', 'font-size': 46, 'font-style': 'italic', 'font-weight': 500, 'letter-spacing': 0.6 }, tb, 'User Manual');
  el('path', { d: 'M288 280 L 390 280 M 460 280 L 562 280', stroke: GRIS, 'stroke-width': 0.9 }, tb);
  [VERDE, ORO, HOJA, TIERRA, CIELO].forEach((c, i) => el('circle', { cx: 405 + i * 10, cy: 280, r: 3.2, fill: c }, tb));
  el('text', { x: W / 2, y: 305, fill: GRIS, 'font-family': 'Jost, sans-serif', 'font-size': 11.5, 'font-weight': 400, 'letter-spacing': 3.2 }, tb,
    'EVALUACIÓN DE PROYECTOS AGROINDUSTRIALES · APPRAISAL OF AGRIFOOD PROJECTS');

  /* ================================================================= the cash flow of a project
     The centrepiece is what the whole app is about: money that leaves once and comes back every
     harvest. The solid bars are the flow of each year; the hollow outline inside each one is what
     that year is worth today, under the curve of the discount factor. */
  const CX = 425, CY = 580;
  el('circle', { cx: CX, cy: CY, r: 210, fill: G.halo });
  el('circle', { cx: CX, cy: CY, r: 178, fill: 'none', stroke: '#cfe0d6', 'stroke-width': 0.9, 'stroke-dasharray': '1.5 5', 'stroke-linecap': 'round' });

  const N = 14, X0 = 258, DX = 25.6, EJE = 646, BW = 15;
  const RATE = 0.12;
  /* gestation of two years, three of ramp-up and full production after that */
  const bruto = [];
  for (let t = 0; t <= N; t++) {
    if (t === 0) bruto.push(-0.62);
    else if (t <= 2) bruto.push(-0.16);
    else if (t <= 5) bruto.push(0.24 * (t - 2));
    else bruto.push(0.78 + (rng() - 0.5) * 0.05);
  }
  bruto[N] += 0.34;                                   /* residual value of the last year */
  const ESC = 100;
  const xt = t => X0 + t * DX;

  /* the discount curve, drawn over the bars: what a peso of each year is worth today */
  const curva = [];
  for (let t = 0; t <= N; t += 0.25) curva.push([xt(t), EJE - 128 * Math.pow(1 + RATE, -t)]);
  el('path', { d: poly(curva) + `L${f1(xt(N))} ${EJE}L${f1(X0)} ${EJE}Z`, fill: G.sol, opacity: 0.7 });
  el('path', { d: poly(curva), fill: 'none', stroke: AMBAR, 'stroke-width': 1.6, 'stroke-dasharray': '5 3.5', 'stroke-linecap': 'round' });

  /* the bars */
  bruto.forEach((v, t) => {
    const x = xt(t) - BW / 2;
    const h = Math.abs(v) * ESC;
    const y = v >= 0 ? EJE - h : EJE;
    const entra = v >= 0;
    el('rect', { x: f1(x), y: f1(y), width: BW, height: f1(h), rx: 2.2, fill: entra ? mix(ENTRA, '#ffffff', 0.18) : mix(SALE, '#ffffff', 0.14) });
    /* what that bar is worth today: the same bar, shrunk by the discount factor */
    const hd = h * Math.pow(1 + RATE, -t);
    el('rect', {
      x: f1(x), y: f1(v >= 0 ? EJE - hd : EJE), width: BW, height: f1(hd), rx: 2.2,
      fill: 'none', stroke: entra ? '#1c6b36' : '#8f2a22', 'stroke-width': 1.1, 'stroke-dasharray': '2.4 2',
    });
  });
  /* the residual value rides on the last bar */
  el('rect', { x: f1(xt(N) - BW / 2), y: f1(EJE - bruto[N] * ESC), width: BW, height: f1(0.34 * ESC), rx: 2.2, fill: ORO });

  /* the axis and its years */
  el('path', { d: `M${X0 - 20} ${EJE}L${f1(xt(N) + 22)} ${EJE}`, stroke: INK, 'stroke-width': 1.5 });
  for (let t = 0; t <= N; t += 2) {
    el('path', { d: `M${f1(xt(t))} ${EJE}L${f1(xt(t))} ${EJE + 5}`, stroke: INK, 'stroke-width': 1 });
    el('text', { x: f1(xt(t)), y: EJE + 17, fill: GRIS, 'font-family': 'Jost, sans-serif', 'font-size': 9.5, 'text-anchor': 'middle' }, null, String(t));
  }

  /* the three stages, named under the axis */
  const etapa = (a, b, texto) => {
    const x1 = xt(a) - BW / 2 - 2, x2 = xt(b) + BW / 2 + 2, ym = EJE + 82;
    el('path', { d: `M${f1(x1)} ${ym}L${f1(x2)} ${ym}`, stroke: GRIS, 'stroke-width': 0.9 });
    el('path', { d: `M${f1(x1)} ${ym - 3}L${f1(x1)} ${ym + 3}M${f1(x2)} ${ym - 3}L${f1(x2)} ${ym + 3}`, stroke: GRIS, 'stroke-width': 0.9 });
    el('text', { x: f1((x1 + x2) / 2), y: ym + 15, fill: GRIS, 'font-family': 'Jost, sans-serif', 'font-size': 8, 'text-anchor': 'middle', 'letter-spacing': 0.3 }, null, texto);
  };
  etapa(0, 2, 'INVERSIÓN');
  etapa(3, 5, 'MADURACIÓN');
  etapa(6, N, 'PRODUCCIÓN PLENA');

  /* the coins of the investment, falling into the furrow */
  (function () {
    const g = el('g');
    const moneda = (cx, cy, r) => {
      el('ellipse', { cx: f1(cx), cy: f1(cy), rx: f1(r), ry: f1(r * 0.42), fill: ORO }, g);
      el('ellipse', { cx: f1(cx), cy: f1(cy - r * 0.2), rx: f1(r), ry: f1(r * 0.42), fill: mix(ORO, '#ffffff', 0.35), stroke: '#a97c12', 'stroke-width': 0.7 }, g);
    };
    for (let i = 0; i < 4; i++) moneda(X0 - 54, EJE + 50 - i * 6.2, 12 - i * 0.7);
    el('path', { d: `M${X0 - 54} ${EJE + 14}L${X0 - 54} ${EJE + 32}`, stroke: SALE, 'stroke-width': 1.4, 'stroke-dasharray': '3 3' });
    el('path', { d: `M${X0 - 58} ${EJE + 28}L${X0 - 54} ${EJE + 35}L${X0 - 50} ${EJE + 28}Z`, fill: SALE }, g);
  })();

  /* what the drawing says, in two rows above the flow */
  const leyenda = el('g');
  el('rect', { x: 292, y: 455, width: 12, height: 9, rx: 2, fill: mix(ENTRA, '#ffffff', 0.18) }, leyenda);
  el('text', { x: 310, y: 464, fill: GRIS, 'font-family': 'Jost, sans-serif', 'font-size': 10 }, leyenda, 'flujo del año');
  el('rect', { x: 400, y: 455, width: 12, height: 9, rx: 2, fill: 'none', stroke: '#1c6b36', 'stroke-width': 1.1, 'stroke-dasharray': '2.4 2' }, leyenda);
  el('text', { x: 418, y: 464, fill: GRIS, 'font-family': 'Jost, sans-serif', 'font-size': 10 }, leyenda, 'su valor presente');
  el('rect', { x: 524, y: 455, width: 12, height: 9, rx: 2, fill: ORO }, leyenda);
  el('text', { x: 542, y: 464, fill: GRIS, 'font-family': 'Jost, sans-serif', 'font-size': 10 }, leyenda, 'valor de rescate');
  el('path', { d: 'M334 480 L 352 480', stroke: AMBAR, 'stroke-width': 1.6, 'stroke-dasharray': '5 3.5', 'stroke-linecap': 'round' }, leyenda);
  el('text', { x: 358, y: 484, fill: AMBAR, 'font-family': 'Jost, sans-serif', 'font-size': 10 }, leyenda, 'cuánto vale hoy un peso de cada año');

  /* ================================================================= the crops of the app, two columns */
  function rotulo(cx, y, comun, ciencia) {
    el('text', { x: cx, y, fill: INK, 'font-family': 'Jost, sans-serif', 'font-size': 10.5, 'font-weight': 500, 'text-anchor': 'middle', 'letter-spacing': 0.4 }, null, comun);
    el('text', { x: cx, y: y + 13, fill: GRIS, 'font-family': 'Cormorant, serif', 'font-style': 'italic', 'font-size': 12.5, 'text-anchor': 'middle' }, null, ciencia);
  }

  /* --- avocado: a branch with two fruits --- */
  (function (cx, cy) {
    const g = el('g', { transform: `translate(${cx} ${cy})` });
    el('path', { d: 'M0 -34 C 2 -14 2 6 0 26', stroke: '#6b4a2a', 'stroke-width': 2.4, fill: 'none', 'stroke-linecap': 'round' }, g);
    [[-1, -22], [1, -6]].forEach(([s, y]) => {
      el('path', { d: `M0 ${y} C ${18 * s} ${y - 12} ${30 * s} ${y - 2} ${12 * s} ${y + 8} C ${4 * s} ${y + 10} ${2 * s} ${y + 4} 0 ${y}Z`, fill: HOJA, opacity: 0.9 }, g);
      el('path', { d: `M0 ${y} L ${20 * s} ${y - 1}`, stroke: '#3d6b1d', 'stroke-width': 0.7 }, g);
    });
    [[-12, 12], [10, 20]].forEach(([dx, dy], i) => {
      el('path', { d: `M${dx} ${dy - 12} C ${dx + 11} ${dy - 10} ${dx + 12} ${dy + 10} ${dx} ${dy + 13} C ${dx - 12} ${dy + 10} ${dx - 11} ${dy - 10} ${dx} ${dy - 12}Z`, fill: i ? '#3f5f2a' : '#4a6b30', stroke: '#2d431d', 'stroke-width': 0.8 }, g);
      el('ellipse', { cx: dx - 3, cy: dy - 3, rx: 3.4, ry: 5, fill: '#ffffff', opacity: 0.16 }, g);
    });
    rotulo(cx, cy + 56, 'AGUACATE', 'Persea americana');
  })(110, 415);

  /* --- maize: an ear with its husk --- */
  (function (cx, cy) {
    const g = el('g', { transform: `translate(${cx} ${cy})` });
    el('path', { d: 'M0 -30 C 14 -22 16 10 0 30 C -16 10 -14 -22 0 -30Z', fill: mix(ORO, '#ffffff', 0.25), stroke: '#a97c12', 'stroke-width': 0.9 }, g);
    for (let r = 0; r < 9; r++) for (let c = -2; c <= 2; c++) {
      const y = -24 + r * 6.2, w = 9.5 - Math.abs(y) * 0.1;
      el('rect', { x: f1(c * 4.6 - 2), y: f1(y), width: 3.8, height: 4.6, rx: 1.6, fill: rng() < 0.25 ? '#b8862a' : ORO, opacity: Math.abs(c) === 2 ? 0.75 : 1 }, g);
    }
    [[-1], [1]].forEach(([s]) => el('path', { d: `M${6 * s} -26 C ${26 * s} -14 ${24 * s} 14 ${4 * s} 30 C ${14 * s} 8 ${16 * s} -12 ${6 * s} -26Z`, fill: HOJA, opacity: 0.85 }, g));
    rotulo(cx, cy + 56, 'MAÍZ', 'Zea mays');
  })(110, 595);

  /* --- nopal: two cladodes --- */
  (function (cx, cy) {
    const g = el('g', { transform: `translate(${cx} ${cy})` });
    const penca = (dx, dy, rot, s) => {
      const gg = el('g', { transform: `translate(${dx} ${dy}) rotate(${rot}) scale(${s})` }, g);
      el('ellipse', { cx: 0, cy: 0, rx: 15, ry: 22, fill: '#4d8a3f', stroke: '#35632b', 'stroke-width': 1 }, gg);
      for (let i = 0; i < 9; i++) {
        const a = rng() * Math.PI * 2, r = 4 + rng() * 11;
        const x = Math.cos(a) * r * 0.65, y = Math.sin(a) * r * 1.25;
        el('circle', { cx: f1(x), cy: f1(y), r: 1.1, fill: '#e8f0d8' }, gg);
      }
    };
    penca(-9, 4, -16, 1);
    penca(13, -12, 22, 0.78);
    el('path', { d: 'M-2 26 C -2 34 -2 36 -2 38', stroke: '#6b4a2a', 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
    rotulo(cx, cy + 58, 'NOPAL VERDURA', 'Opuntia ficus-indica');
  })(110, 772);

  /* --- coffee: a branch with cherries --- */
  (function (cx, cy) {
    const g = el('g', { transform: `translate(${cx} ${cy})` });
    el('path', { d: 'M-22 -28 C -6 -12 6 6 20 26', stroke: '#6b4a2a', 'stroke-width': 2.2, fill: 'none', 'stroke-linecap': 'round' }, g);
    [[-14, -18, -1], [-2, -2, 1], [8, 12, -1]].forEach(([x, y, s]) => {
      el('path', { d: `M${x} ${y} C ${x + 16 * s} ${y - 14} ${x + 26 * s} ${y - 2} ${x + 10 * s} ${y + 9} C ${x + 3 * s} ${y + 10} ${x + s} ${y + 4} ${x} ${y}Z`, fill: '#2f6b3a', opacity: 0.92 }, g);
      el('path', { d: `M${x} ${y} L ${x + 17 * s} ${y - 2}`, stroke: '#1f4a27', 'stroke-width': 0.7 }, g);
    });
    [[-9, -6], [2, 8], [-4, 16], [9, 22]].forEach(([x, y], i) => {
      el('circle', { cx: x, cy: y, r: 5.2, fill: i % 2 ? '#c0392b' : '#a5281d', stroke: '#7d1d15', 'stroke-width': 0.7 }, g);
      el('circle', { cx: x - 1.6, cy: y - 1.8, r: 1.5, fill: '#ffffff', opacity: 0.3 }, g);
    });
    rotulo(cx, cy + 56, 'CAFÉ DE ALTURA', 'Coffea arabica');
  })(740, 415);

  /* --- greenhouse tomato: the house and the truss --- */
  (function (cx, cy) {
    const g = el('g', { transform: `translate(${cx} ${cy})` });
    el('path', { d: 'M-34 16 L -34 -8 L 0 -30 L 34 -8 L 34 16Z', fill: '#e8f1f7', stroke: CIELO, 'stroke-width': 1.3 }, g);
    el('path', { d: 'M-34 -8 L 0 -30 L 34 -8', fill: 'none', stroke: CIELO, 'stroke-width': 1.3 }, g);
    [-17, 0, 17].forEach(x => el('path', { d: `M${x} 16 L ${x} ${x === 0 ? -30 : -19}`, stroke: '#b9d4e6', 'stroke-width': 0.9 }, g));
    el('path', { d: 'M0 16 L 0 -6', stroke: '#3d6b1d', 'stroke-width': 1.6 }, g);
    [[-6, 0], [6, 3], [-5, 8], [6, 11]].forEach(([x, y]) => {
      el('circle', { cx: x, cy: y, r: 4.4, fill: '#d2352a', stroke: '#8f2a22', 'stroke-width': 0.7 }, g);
      el('path', { d: `M${x} ${y - 4.4} l -2 -2 M${x} ${y - 4.4} l 2 -2`, stroke: '#3d6b1d', 'stroke-width': 0.9 }, g);
    });
    el('path', { d: 'M-40 16 L 40 16', stroke: '#6b4a2a', 'stroke-width': 2 }, g);
    rotulo(cx, cy + 56, 'JITOMATE EN INVERNADERO', 'Solanum lycopersicum');
  })(740, 595);

  /* --- strawberry under a macrotunnel --- */
  (function (cx, cy) {
    const g = el('g', { transform: `translate(${cx} ${cy})` });
    el('path', { d: 'M-36 18 C -36 -18 36 -18 36 18', fill: 'none', stroke: '#9fc3d8', 'stroke-width': 1.4, 'stroke-dasharray': '4 3' }, g);
    el('path', { d: 'M-40 18 L 40 18', stroke: '#6b4a2a', 'stroke-width': 2 }, g);
    [[-16, 0], [16, 0]].forEach(([dx]) => {
      el('path', { d: `M${dx} 14 C ${dx - 12} 6 ${dx - 12} -6 ${dx - 3} -8`, fill: 'none', stroke: '#3d6b1d', 'stroke-width': 1.2 }, g);
      el('path', { d: `M${dx} 14 C ${dx + 12} 6 ${dx + 12} -6 ${dx + 3} -8`, fill: 'none', stroke: '#3d6b1d', 'stroke-width': 1.2 }, g);
    });
    [[-16, 6], [0, 10], [16, 4]].forEach(([x, y], i) => {
      el('path', { d: `M${x} ${y - 5} C ${x + 7} ${y - 5} ${x + 7} ${y + 4} ${x} ${y + 9} C ${x - 7} ${y + 4} ${x - 7} ${y - 5} ${x} ${y - 5}Z`, fill: '#cf2f45', stroke: '#8f1f2f', 'stroke-width': 0.7 }, g);
      for (let k = 0; k < 5; k++) el('circle', { cx: f1(x - 3 + rng() * 6), cy: f1(y - 2 + rng() * 8), r: 0.6, fill: '#ffe9a8' }, g);
      el('path', { d: `M${x - 4} ${y - 5} L ${x} ${y - 9} L ${x + 4} ${y - 5}Z`, fill: '#3d6b1d' }, g);
    });
    rotulo(cx, cy + 58, 'FRESA EN MACROTÚNEL', 'Fragaria × ananassa');
  })(740, 772);

  /* ================================================================= four vignettes of the app */
  const VY = 866, VH = 104, VW = 172, VG = 24;
  const VX = (W - (VW * 4 + VG * 3)) / 2;
  function vineta(i, titulo, color, dibujo) {
    const x = VX + i * (VW + VG);
    const g = el('g', { transform: `translate(${f1(x)} ${VY})` });
    el('rect', { x: 0, y: 0, width: VW, height: VH, rx: 8, fill: '#fbfcfb', stroke: '#e2eae5', 'stroke-width': 1 }, g);
    el('rect', { x: 0, y: 0, width: VW, height: 3.2, rx: 1.6, fill: color }, g);
    dibujo(g);
    el('text', { x: VW / 2, y: VH + 15, fill: GRIS, 'font-family': 'Jost, sans-serif', 'font-size': 9.2, 'text-anchor': 'middle', 'letter-spacing': 0.7 }, g, titulo);
    return g;
  }

  /* 1 · the NPV profile and its IRR */
  vineta(0, 'PERFIL DEL VAN Y LA TIR', VERDE, g => {
    const x0 = 16, x1 = VW - 16, y0 = 26, y1 = VH - 20, cero = y1 - 26;
    el('path', { d: `M${x0} ${cero}L${x1} ${cero}`, stroke: '#c3d1c7', 'stroke-width': 1 }, g);
    const pts = [];
    for (let k = 0; k <= 40; k++) { const u = k / 40; pts.push([x0 + u * (x1 - x0), y0 + (y1 - y0 - 8) * Math.pow(u, 0.72)]); }
    const cruce = pts.find(p => p[1] >= cero) || pts[pts.length - 1];
    el('path', { d: poly(pts), fill: 'none', stroke: VERDE, 'stroke-width': 2 }, g);
    el('circle', { cx: f1(cruce[0]), cy: f1(cero), r: 3.4, fill: AMBAR }, g);
    el('text', { x: f1(cruce[0] + 6), y: f1(cero - 6), fill: AMBAR, 'font-family': 'Jost, sans-serif', 'font-size': 8.4 }, g, 'TIR');
    el('path', { d: `M${x0} ${y0 - 4}L${x0} ${y1}`, stroke: '#c3d1c7', 'stroke-width': 1 }, g);
  });

  /* 2 · the break-even */
  vineta(1, 'PUNTO DE EQUILIBRIO', HOJA, g => {
    const x0 = 16, x1 = VW - 16, y0 = 22, y1 = VH - 20;
    el('path', { d: `M${x0} ${y1}L${x1} ${y1}M${x0} ${y0 - 2}L${x0} ${y1}`, stroke: '#c3d1c7', 'stroke-width': 1 }, g);
    el('path', { d: `M${x0} ${y1 - 14}L${x1} ${y1 - 46}`, stroke: SALE, 'stroke-width': 1.8 }, g);
    el('path', { d: `M${x0} ${y1}L${x1} ${y0 + 2}`, stroke: ENTRA, 'stroke-width': 1.8 }, g);
    /* the two lines cross where the loss turns into profit */
    const t = 14 / ((y1 - y0 - 2) - 32) * (x1 - x0);
    const px = x0 + t, py = y1 - 14 - (32 / (x1 - x0)) * t;
    el('path', { d: `M${f1(px)} ${f1(py)}L${f1(px)} ${y1}`, stroke: AMBAR, 'stroke-width': 1, 'stroke-dasharray': '2.5 2' }, g);
    el('circle', { cx: f1(px), cy: f1(py), r: 3.4, fill: AMBAR }, g);
    el('text', { x: f1(px + 6), y: f1(py - 5), fill: GRIS, 'font-family': 'Jost, sans-serif', 'font-size': 8.4 }, g, 'Q*');
  });

  /* 3 · the Monte Carlo simulation */
  vineta(2, 'SIMULACIÓN DE MONTE CARLO', ROSA, g => {
    const x0 = 14, x1 = VW - 14, y1 = VH - 20, n = 22;
    const w = (x1 - x0) / n;
    for (let k = 0; k < n; k++) {
      const u = (k + 0.5) / n;
      const h = 54 * Math.exp(-Math.pow((u - 0.56) * 3.1, 2) * 2.2);
      el('rect', { x: f1(x0 + k * w), y: f1(y1 - h), width: f1(w - 1), height: f1(h), rx: 1, fill: u < 0.3 ? mix(SALE, '#ffffff', 0.45) : mix(ROSA, '#ffffff', 0.35) }, g);
    }
    el('path', { d: `M${x0} ${y1}L${x1} ${y1}`, stroke: '#c3d1c7', 'stroke-width': 1 }, g);
    const xc = x0 + (x1 - x0) * 0.3;
    el('path', { d: `M${f1(xc)} ${y1 - 62}L${f1(xc)} ${y1}`, stroke: INK, 'stroke-width': 1.2, 'stroke-dasharray': '3 2' }, g);
    el('text', { x: f1(xc - 3), y: y1 - 66, fill: INK, 'font-family': 'Jost, sans-serif', 'font-size': 8.4, 'text-anchor': 'end' }, g, 'VAN = 0');
  });

  /* 4 · from the private result to the economic one */
  vineta(3, 'DEL VAN PRIVADO AL ECONÓMICO', '#7b5ea7', g => {
    const y1 = VH - 20, x0 = 16;
    const pasos = [[26, 0.42, VERDE], [22, 0.18, '#7b5ea7'], [20, 0.16, ORO], [24, -0.1, TIERRA], [30, 0.34, '#7b5ea7']];
    let acc = 0, x = x0;
    pasos.forEach(([w, d, c], i) => {
      const h0 = y1 - acc * 78, h1 = y1 - (acc + d) * 78;
      const top = Math.min(h0, h1), alto = Math.max(2.5, Math.abs(h1 - h0));
      el('rect', { x: f1(x), y: f1(top), width: w - 4, height: f1(alto), rx: 1.6, fill: i === 0 || i === pasos.length - 1 ? c : mix(c, '#ffffff', 0.4) }, g);
      if (i < pasos.length - 1) el('path', { d: `M${f1(x + w - 4)} ${f1(h1)}L${f1(x + w)} ${f1(h1)}`, stroke: '#b9c4bd', 'stroke-width': 0.9, 'stroke-dasharray': '2 1.6' }, g);
      acc += d; x += w;
    });
    el('path', { d: `M${x0} ${y1}L${VW - 14} ${y1}`, stroke: '#c3d1c7', 'stroke-width': 1 }, g);
  });

  /* ---------------------------------------------------------------- author */
  const au = el('g', { 'text-anchor': 'middle' });
  el('text', { x: W / 2, y: 1046, fill: INK, 'font-family': 'Cormorant, serif', 'font-size': 33, 'font-weight': 600, 'letter-spacing': 1.4 }, au, 'Luis Ángel Barrera-Guzmán');
  el('text', { x: W / 2, y: 1072, fill: GRIS, 'font-family': 'Jost, sans-serif', 'font-size': 10.5, 'font-weight': 400, 'letter-spacing': 4 }, au, 'VERSIÓN 1.0 · VERSION 1.0 · 2026');
})();
</script>
