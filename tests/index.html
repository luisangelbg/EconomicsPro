  const A6 = { rateProject: null, rateEquity: null, treatments: [], adjust: 0.10, minimumRate: 1, fieldPrice: null };
  const P6 = Project.merge(P5, { rate: { mode: 'manual', manual: 0.10, manualIsReal: true }, inflation: 0.045 });
  const AP = Appraisal.build(A6, P6, S5);

  check('la tasa del proyecto viene del Bloque 2 cuando no se escribe otra', near(AP.rateProject, 0.10, 1e-12));
  check('con una TREMA, la tasa del dueño es la misma', near(AP.rateEquity, 0.10, 1e-12));
  check('el VAN coincide con el que da el motor financiero',
    near(AP.project.npv, Fin.npv(0.10, S5.projectFlow), 1e-9), fmtMoney(AP.project.npv, 2));
  check('el VAN se puede calcular a mano: −105,000 + 45,000·(P/A,10%,3) + 75,000/1.1³',
    near(AP.project.npv, -105000 + 45000 * Fin.annuityFactor(0.1, 3) + 75000 / Math.pow(1.1, 3), 1e-6));
  check('la TIR hace cero el VAN', near(Fin.npv(AP.project.irr, S5.projectFlow), 0, 1e-4), fmtPct(AP.project.irr, 3));
  check('el valor anual equivalente reparte el VAN en anualidades',
    near(AP.project.eaa, AP.project.npv * Fin.capitalRecovery(0.10, 3), 1e-6));

  /* --- the decomposition has to add up to the NPV, exactly --- */
  check('las piezas del VAN suman el VAN', (() => {
    const p = AP.parts;
    return near(p.revenue - p.cost - p.tax - p.investment + p.salvage, AP.project.npv, 1e-6);
  })(), fmtMoney(AP.parts.npv, 2));
  check('el valor presente de los ingresos es el que corresponde',
    near(AP.parts.revenue, 100000 * Fin.annuityFactor(0.1, 3), 1e-6));
  check('la inversión de la descomposición es la del año 0', near(AP.parts.investment, 105000, 1e-6));
  check('el valor de rescate entra descontado al último año', near(AP.parts.salvage, 75000 / Math.pow(1.1, 3), 1e-6));
  check('la descomposición también cuadra con crédito y con gestación', (() => {
    const a = Appraisal.build(A6, P6, S5L), b = Appraisal.build(A6, Project.merge(P5g, { rate: { mode: 'manual', manual: 0.10, manualIsReal: true } }), S5g);
    const ok = x => near(x.parts.revenue - x.parts.cost - x.parts.tax - x.parts.investment + x.parts.salvage, x.project.npv, 1e-6);
    return ok(a) && ok(b);
  })());

  /* --- each flow with its own rate --- */
  const P6w = Project.merge(P5, {
    inflation: 0, priceBasis: 'constant',
    rate: { mode: 'wacc', equity: 60, debt: 40, costEquity: 0.18, costDebt: 0.12 },
    tax: { income: 0.30 },
  });
  check('con CPPC, la tasa del proyecto es el costo promedio ponderado',
    near(Appraisal.build(A6, P6w, S5L).rateProject, 0.6 * 0.18 + 0.4 * 0.12 * 0.7, 1e-12));
  check('y la del dueño es el costo de su propio capital', near(Appraisal.equityRate(P6w), 0.18, 1e-12));
  check('la tasa del dueño es más cara que la del proyecto cuando hay deuda',
    Appraisal.equityRate(P6w) > Appraisal.build(A6, P6w, S5L).rateProject);
  check('con CAPM, la tasa del dueño sale del modelo', (() => {
    const p = Project.merge(P5, { inflation: 0, rate: { mode: 'capm', rf: 0.07, beta: 1.1, marketPremium: 0.06, countryRisk: 0.02 } });
    return near(Appraisal.equityRate(p), 0.07 + 1.1 * 0.06 + 0.02, 1e-12);
  })());
  check('a precios constantes la tasa del dueño se deflacta con Fisher', (() => {
    const p = Project.merge(P5, { inflation: 0.05, priceBasis: 'constant', rate: { mode: 'wacc', equity: 100, debt: 0, costEquity: 0.18 } });
    return near(Appraisal.equityRate(p), Fin.realRate(0.18, 0.05), 1e-12);
  })());
  check('una tasa escrita a mano manda sobre la del Bloque 2',
    near(Appraisal.build({ rateProject: 0.2, rateEquity: 0.25, treatments: [] }, P6, S5).rateProject, 0.2, 1e-12));

  /* --- what the loan does --- */
  const APL = Appraisal.build(A6, P6, S5L);
  check('el crédito no cambia el VAN del proyecto', near(APL.project.npv, AP.project.npv, 1e-9));
  check('el crédito sí cambia el del inversionista', !near(APL.investor.npv, AP.investor.npv, 1));
  check('con crédito barato el dueño gana más que sin él', APL.investor.npv > AP.investor.npv,
    fmtMoney(APL.investor.npv, 0) + ' contra ' + fmtMoney(AP.investor.npv, 0));
  check('el dictamen nombra el VAN, la TIR y la recuperación',
    /VAN|valor actual neto/i.test(AP.verdict.es) && /tasa interna/i.test(AP.verdict.es) && /recupera/i.test(AP.verdict.es));
  check('el dictamen existe en los dos idiomas', AP.verdict.en !== AP.verdict.es && /net present value/i.test(AP.verdict.en));

  /* --- the coherence checks --- */
  check('una TIR múltiple se avisa y se listan todas', (() => {
    const st = JSON.parse(JSON.stringify(S5));
    st.projectFlow = [-1000, 3000, -2200];
    st.investorFlow = [-1000, 3000, -2200];
    st.rows = st.rows.slice(0, 2);
    const m = Appraisal.build(A6, P6, st);
    return m.project.multipleIRR && m.messages.some(x => /TIR modificada|modified IRR/.test(x.es + x.en));
  })());
  check('un VAN frágil ante dos puntos de tasa se avisa', (() => {
    const st = JSON.parse(JSON.stringify(S5));
    /* a project whose NPV is barely positive at 10 % */
    st.projectFlow = [-89000, 36000, 36000, 36000];
    st.investorFlow = st.projectFlow.slice();
    const m = Appraisal.build(A6, P6, st);
    return m.project.npv > 0 && m.messages.some(x => /frágil|fragile/.test(x.es + x.en));
  })());
  check('una tasa del dueño menor que la del proyecto se cuestiona',
    Appraisal.build({ rateProject: 0.15, rateEquity: 0.08, treatments: [] }, P6, S5)
      .messages.some(x => /menor que la del proyecto|below the project/.test(x.es + x.en)));
  check('si el proyecto conviene pero el inversionista pierde, se explica', (() => {
    const m = Appraisal.build({ rateProject: 0.10, rateEquity: 0.90, treatments: [] }, P6, S5L);
    return m.project.npv > 0 && m.investor.npv <= 0 && m.messages.some(x => /el inversionista pierde|the investor loses/.test(x.es + x.en));
  })());
  check('cada aviso del Bloque 6 viene en los dos idiomas', AP.messages.every(x => x.es && x.en && x.level));

  /* ============================================================
     marginal analysis (Perrin et al., CIMMYT 1976)
     ============================================================ */
  const TREAT = [
    { name: 'Sin fertilizar', yield: 3.0, cost: 0 },
    { name: '60 kg N', yield: 4.2, cost: 3600 },
    { name: '120 kg N', yield: 5.0, cost: 7200 },
    { name: '120 kg N + herbicida', yield: 5.1, cost: 9000 },
    { name: '180 kg N', yield: 5.2, cost: 10800 },
  ];
  const MG = Appraisal.marginal({ treatments: TREAT, price: 5600, adjust: 0.10, minimumRate: 1 });
  check('el rendimiento se ajusta hacia abajo antes de valorarlo', near(MG.rows[0].adjusted, 2.7, 1e-9));
  check('el beneficio bruto de campo es rendimiento ajustado por precio de campo', near(MG.rows[0].gross, 2.7 * 5600, 1e-9));
  check('el beneficio neto descuenta solo los costos que varían', near(MG.rows[1].net, 3.78 * 5600 - 3600, 1e-9), fmtMoney(MG.rows[1].net, 0));
  check('los tratamientos se ordenan por lo que cuestan', MG.rows.every((r, i) => i === 0 || r.varCost >= MG.rows[i - 1].varCost));
  check('un tratamiento que cuesta más y deja menos queda dominado',
    MG.rows[3].dominated === true && MG.rows[4].dominated === true);
  check('los que no son dominados forman una frontera creciente',
    MG.kept.every((r, i) => i === 0 || r.net > MG.kept[i - 1].net));
  check('la tasa de retorno marginal del primer escalón es 68 %',
    near(MG.kept[1].mrr, (17568 - 15120) / 3600, 1e-9), fmtPct(MG.kept[1].mrr, 1));
  check('la del segundo escalón es 12 %', near(MG.kept[2].mrr, (18000 - 17568) / 3600, 1e-9), fmtPct(MG.kept[2].mrr, 1));
  check('con una tasa mínima de 100 % no se justifica fertilizar', MG.recommended.name === 'Sin fertilizar');
  check('con una tasa mínima de 50 % se recomienda el primer escalón',
    Appraisal.marginal({ treatments: TREAT, price: 5600, adjust: 0.10, minimumRate: 0.5 }).recommended.name === '60 kg N');
  check('con una tasa mínima de 10 % se llega hasta el segundo escalón',
    Appraisal.marginal({ treatments: TREAT, price: 5600, adjust: 0.10, minimumRate: 0.1 }).recommended.name === '120 kg N');
  check('sin ajuste del rendimiento los beneficios suben', (() => {
    const raw = Appraisal.marginal({ treatments: TREAT, price: 5600, adjust: 0, minimumRate: 1 });
    return raw.rows[0].net > MG.rows[0].net;
  })());
  check('un precio propio por tratamiento manda sobre el general', (() => {
    const mg = Appraisal.marginal({ treatments: [{ name: 'A', yield: 1, cost: 0, price: 1000 }], price: 5600, adjust: 0 });
    return near(mg.rows[0].gross, 1000, 1e-9);
  })());
  check('una lista vacía no rompe nada', Appraisal.marginal({ treatments: [], price: 100 }).rows.length === 0);

  /* --- the figures --- */
  check('las cuatro figuras del Bloque 6 se dibujan sin error', (() => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    document.body.appendChild(svg);
    try {
      Plots6.drawProfile(svg, APL);
      Plots6.drawWaterfall(svg, APL);
      Plots6.drawPayback(svg, APL);
      Plots6.drawMarginal(svg, MG);
      return svg.childElementCount > 0;
    } catch (e) { return false; } finally { document.body.removeChild(svg); }
  })());
  check('las figuras aguantan un proyecto sin TIR y un análisis vacío', (() => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    document.body.appendChild(svg);
    const st = JSON.parse(JSON.stringify(S5));
    st.projectFlow = [-100, -50, -20, -10];
    st.investorFlow = st.projectFlow.slice();
    try {
      const m = Appraisal.build(A6, P6, st);
      Plots6.drawProfile(svg, m);
      Plots6.drawWaterfall(svg, m);
      Plots6.drawPayback(svg, m);
      Plots6.drawMarginal(svg, Appraisal.marginal({ treatments: [], price: 0 }));
      return true;
    } catch (e) { return false; } finally { document.body.removeChild(svg); }
  })());

  /* ============================================================
     Block 7: risk and uncertainty
     ============================================================ */
  section('Riesgo e incertidumbre (Bloque 7)');

  const BASE7 = Risk.baseline(P5, MK5, BG5, Object.assign({}, S5, { rateProject: 0.10 }));

  /* --- the fast rebuild has to be the same flow, not a similar one --- */
  check('con todos los multiplicadores en 1, el flujo reconstruido es idéntico al del Bloque 5',
    Risk.rebuild(BASE7, {}).flow.every((v, i) => near(v, S5.projectFlow[i], 1e-6)),
    'diferencia máxima ' + fmtFixed(Math.max(...Risk.rebuild(BASE7, {}).flow.map((v, i) => Math.abs(v - S5.projectFlow[i]))), 8));
  check('y el VAN reconstruido es el mismo', near(Risk.npvOf(BASE7, {}), Fin.npv(0.10, S5.projectFlow), 1e-6));

  /* the strong check: against the whole chain, not against itself */
  check('subir el precio 10 % da lo mismo por el camino rápido que rehaciendo todo el estudio', (() => {
    const mk = JSON.parse(JSON.stringify(MK5));
    mk.prog.rows.forEach(r => { r.revenue *= 1.1; r.total *= 1.1; r.effectivePrice *= 1.1; });
    const full = FinState.build({ longTermShare: 0, seasonalShare: 0, fee: 0 }, P5, mk, BG5);
    const fast = Risk.rebuild(BASE7, { price: 1.1 }).flow;
    return full.projectFlow.every((v, i) => near(v, fast[i], 1e-6));
  })());
  check('y bajar los costos 10 % también', (() => {
    const bg = JSON.parse(JSON.stringify(BG5));
    bg.costs.forEach(c => { c.volumeCost *= 0.9; c.capacityCost *= 0.9; c.cash = c.volumeCost + c.capacityCost; });
    bg.wc = { need: bg.costs.map(c => c.cash * 0.125), invest: [bg.costs[0].cash * 0.125, 0, 0, 0] };
    bg.schedule[0].workingCapital = bg.costs[0].cash * 0.125;
    bg.salvage = { total: 70000 + bg.costs[0].cash * 0.125, assets: 70000, land: 0, workingCapital: bg.costs[0].cash * 0.125 };
    const full = FinState.build({ longTermShare: 0, seasonalShare: 0, fee: 0 }, P5, MK5, bg);
    const fast = Risk.rebuild(BASE7, { cost: 0.9 }).flow;
    return full.projectFlow.every((v, i) => near(v, fast[i], 1e-6));
  })(), 'incluye el capital de trabajo, que sigue al costo');
  check('el rendimiento mueve el ingreso y los costos por tonelada, no los de superficie', (() => {
    const built = Risk.rebuild(BASE7, { yield: 1.2 });
    const r = built.rows[0];
    return near(r.revenue, 100000 * 1.2, 1e-9) && near(r.cost, 30000 * 1.2 + 10000, 1e-9);
  })());
  check('la inversión mueve la depreciación y el valor de rescate', (() => {
    const built = Risk.rebuild(BASE7, { invest: 1.5 });
    return near(built.rows[0].depreciation, 10000 * 1.5, 1e-9) && near(built.flow[0], -(100000 * 1.5 + 5000), 1e-9);
  })());
  check('el impuesto se vuelve a calcular, no se escala', (() => {
    const built = Risk.rebuild(BASE7, { price: 0.4 });
    /* with 40 % of the revenue the year loses money, so it pays no tax */
    return built.rows[0].ebit < 0 && near(built.rows[0].tax, 0, 1e-9);
  })());
  check('las pérdidas de los años sin producir se amortizan después, también al reconstruir', (() => {
    const baseG = Risk.baseline(P5g, MK5g, BG5g, Object.assign({}, S5g, { rateProject: 0.10 }));
    const built = Risk.rebuild(baseG, {});
    const loss = built.rows.filter(r => r.ebit < 0);
    const profit = built.rows.filter(r => r.ebit > 0);
    /* the first profitable year still carries the losses, so it pays less tax
       than the one after it */
    return loss.length === 2 && profit.length > 1 && profit[0].tax < profit[1].tax;
  })());

  /* --- sensitivity --- */
  const SP = Risk.spider(BASE7, [-0.2, -0.1, 0, 0.1, 0.2]);
  check('la araña trae una línea por variable', SP.length === Risk.VARS.length);
  check('en el cambio cero todas las líneas pasan por el VAN base',
    SP.every(l => near(l.points.find(p => p.change === 0).npv, Risk.npvOf(BASE7, {}), 1e-6)));
  check('subir el precio sube el VAN y subir el costo lo baja', (() => {
    const price = SP.find(l => l.key === 'price'), cost = SP.find(l => l.key === 'cost');
    return price.points[4].npv > price.points[0].npv && cost.points[4].npv < cost.points[0].npv;
  })());
  const SW = Risk.switching(BASE7);
  check('los valores límite anulan el VAN, por construcción',
    SW.filter(s => s.multiplier != null).every(s => near(Risk.npvOf(BASE7, { [s.key]: s.multiplier }), 0, 1)),
    SW.map(s => s.key + ' ' + (s.change == null ? '—' : fmtPct(s.change, 1))).join(' · '));
  check('la lista se ordena de la variable más frágil a la más robusta',
    SW.every((s, i) => i === 0 || Math.abs(s.change == null ? Infinity : s.change) >= Math.abs(SW[i - 1].change == null ? Infinity : SW[i - 1].change)));
  const TOR = Risk.tornado(BASE7, 0.1);
  check('el tornado se ordena por amplitud', TOR.every((r, i) => i === 0 || r.swing <= TOR[i - 1].swing));
  check('en este proyecto el precio manda sobre la inversión',
    TOR.findIndex(r => r.name === 'price') < TOR.findIndex(r => r.name === 'invest'));

  /* --- two variables --- */
  const G2 = Risk.grid2(BASE7, 'price', 'yield', [-0.2, -0.1, 0, 0.1, 0.2]);
  check('la tabla de dos variables es cuadrada', G2.rows.length === 5 && G2.rows[0].values.length === 5);
  check('la esquina de precio y rendimiento altos es la mejor',
    G2.rows[4].values[4] === Math.max(...G2.rows.reduce((a, r) => a.concat(r.values), [])));
  check('el centro de la tabla es el caso base', near(G2.rows[2].values[2], Risk.npvOf(BASE7, {}), 1e-6));

  /* --- scenarios --- */
  const SC = Risk.scenarios(BASE7, [
    { name: 'Pesimista', probability: 0.25, price: -0.2, yield: -0.15 },
    { name: 'Esperado', probability: 0.5 },
    { name: 'Optimista', probability: 0.25, price: 0.15, yield: 0.1 },
  ]);
  check('el escenario esperado reproduce el caso base', near(SC.list[1].npv, Risk.npvOf(BASE7, {}), 1e-6));
  check('el pesimista queda por debajo y el optimista por encima', SC.list[0].npv < SC.list[1].npv && SC.list[2].npv > SC.list[1].npv);
  check('el valor esperado es el promedio ponderado',
    near(SC.expected, SC.list.reduce((a, s) => a + s.npv * s.probability, 0), 1e-6), fmtMoney(SC.expected, 0));
  check('la desviación mide qué tanto depende el resultado del escenario', SC.sd > 0);
  check('las probabilidades se normalizan si no suman 100 %', (() => {
    const s = Risk.scenarios(BASE7, [{ name: 'A', probability: 1 }, { name: 'B', probability: 1, price: 0.1 }]);
    return near(s.probabilityTotal, 2, 1e-9) && near(s.expected, (s.list[0].npv + s.list[1].npv) / 2, 1e-6);
  })());

  /* --- Monte Carlo --- */
  const SIM = Risk.simulate(BASE7, {
    dist: 'triangular', corr: -0.3, n: 800, seed: 5,
    price: { spread: 0.25 }, yield: { spread: 0.2 }, cost: { spread: 0.12 }, invest: { spread: 0.1 },
  });
  check('la simulación corre y devuelve la distribución del VAN', SIM && SIM.n === 800 && SIM.values.length === 800);
  check('la media de la simulación queda cerca del caso base',
    Math.abs(SIM.mean - Risk.npvOf(BASE7, {})) < Math.abs(Risk.npvOf(BASE7, {})) * 0.3,
    fmtMoney(SIM.mean, 0) + ' contra ' + fmtMoney(Risk.npvOf(BASE7, {}), 0));
  check('los percentiles están ordenados', SIM.p05 < SIM.median && SIM.median < SIM.p95);
  check('la probabilidad de pérdida es la proporción de corridas negativas',
    near(SIM.pLoss, SIM.values.filter(v => v < 0).length / SIM.values.length, 1e-12), fmtPct(SIM.pLoss, 1));
  check('la misma semilla da el mismo resultado', (() => {
    const a = Risk.simulate(BASE7, { corr: -0.3, n: 300, seed: 9, price: { spread: 0.2 }, yield: { spread: 0.2 } });
    const b = Risk.simulate(BASE7, { corr: -0.3, n: 300, seed: 9, price: { spread: 0.2 }, yield: { spread: 0.2 } });
    return near(a.mean, b.mean, 1e-12) && near(a.pLoss, b.pLoss, 1e-12);
  })());
  check('lo que explica la variación viene ordenado y el precio sale arriba',
    SIM.drivers.length > 1 && Math.abs(SIM.drivers[0].r) >= Math.abs(SIM.drivers[1].r) && SIM.drivers[0].key === 'price',
    SIM.drivers.map(d => d.key + ' ' + fmtFixed(d.r, 2)).join(' · '));
  check('el precio se correlaciona positivamente con el VAN y el costo, negativamente',
    SIM.drivers.find(d => d.key === 'price').r > 0 && SIM.drivers.find(d => d.key === 'cost').r < 0);
  check('ignorar la correlación entre precio y rendimiento ensancha la distribución', (() => {
    const withCorr = Risk.simulate(BASE7, { corr: -0.6, n: 1500, seed: 3, price: { spread: 0.3 }, yield: { spread: 0.3 } });
    const without = Risk.simulate(BASE7, { corr: 0, n: 1500, seed: 3, price: { spread: 0.3 }, yield: { spread: 0.3 } });
    return without.sd > withCorr.sd;
  })(), 'es el punto que explica el bloque');
  check('sin rangos declarados no hay simulación', Risk.simulate(BASE7, { price: { spread: 0 } }) === null);

  /* --- the decision tree --- */
  const TREE = Risk.decisionTree({ probability: 0.6, npvGood: 1000, npvBad: -500, rate: 0.10 });
  check('invertir ahora vale el promedio ponderado de los dos escenarios',
    near(TREE.now, 0.6 * 1000 + 0.4 * -500, 1e-9), fmtMoney(TREE.now, 2));
  check('esperar evita el escenario malo, pero llega un año después',
    near(TREE.wait, (0.6 * 1000 + 0.4 * 0) / 1.1, 1e-9), fmtMoney(TREE.wait, 2));
  check('el valor de la opción de esperar es la diferencia', near(TREE.option, TREE.wait - TREE.now, 1e-12));
  check('aquí conviene esperar', TREE.best === 'wait');
  check('si el escenario malo también gana dinero, esperar solo cuesta un año', (() => {
    const t = Risk.decisionTree({ probability: 0.6, npvGood: 1000, npvBad: 500, rate: 0.10 });
    return t.best === 'now' && t.option < 0;
  })());
  check('el valor de la información perfecta es lo que se gana por saber antes',
    near(TREE.perfectInfo, (0.6 * 1000 + 0.4 * 0) - TREE.now, 1e-9), fmtMoney(TREE.perfectInfo, 2));

  /* --- coherence --- */
  const mkRisk = over => Object.assign({
    base: BASE7, npv0: Risk.npvOf(BASE7, {}), switching: SW, sim: null, scenarios: SC,
    spec: { corr: -0.3 },
  }, over || {});
  check('una variable que aguanta menos del 10 % se marca como frágil', (() => {
    const tight = [{ key: 'price', es: 'Precio', en: 'Price', change: -0.05, multiplier: 0.95 }];
    return Risk.validate(mkRisk({ switching: tight }), P5).some(m => /frágil|fragile/.test(m.es + m.en));
  })());
  check('una probabilidad de pérdida alta se avisa',
    Risk.validate(mkRisk({ sim: { pLoss: 0.4, mean: 1, drivers: [] } }), P5).some(m => /arriesgado|risky/.test(m.es + m.en)));
  check('simular precio y rendimiento como independientes se señala',
    Risk.validate(mkRisk({ sim: { pLoss: 0.1, mean: 1, drivers: [] }, spec: { corr: 0 } }), P5).some(m => /independientes|independent/.test(m.es + m.en)));
  check('probabilidades de escenarios que no suman 100 % se avisan', (() => {
    const s = Risk.scenarios(BASE7, [{ name: 'A', probability: 0.3 }, { name: 'B', probability: 0.3 }]);
    return Risk.validate(mkRisk({ scenarios: s }), P5).some(m => /suman|add up/.test(m.es + m.en));
  })());
  check('cada aviso del Bloque 7 viene en los dos idiomas',
    Risk.validate(mkRisk({ sim: { pLoss: 0.4, mean: 1, drivers: [] } }), P5).every(m => m.es && m.en && m.level));

  /* --- the figures --- */
  check('las seis figuras del Bloque 7 se dibujan sin error', (() => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    document.body.appendChild(svg);
    try {
      Plots7.drawSpider(svg, SP);
      Plots7.drawTornado(svg, TOR, Risk.npvOf(BASE7, {}));
      Plots7.drawHeat(svg, G2, { a: 'precio', b: 'rendimiento' });
      Plots7.drawHistogram(svg, SIM);
      Plots7.drawDrivers(svg, SIM.drivers);
      Plots7.drawTree(svg, TREE);
      return svg.childElementCount > 0;
    } catch (e) { return false; } finally { document.body.removeChild(svg); }
  })());
  check('las figuras aguantan que no haya simulación todavía', (() => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    document.body.appendChild(svg);
    try {
      Plots7.drawHistogram(svg, null);
      Plots7.drawDrivers(svg, null);
      Plots7.drawSpider(svg, []);
      return true;
    } catch (e) { return false; } finally { document.body.removeChild(svg); }
  })());

  /* ============================================================
     Block 8: economic and social appraisal
     ============================================================ */
  section('Evaluación económica y social (Bloque 8)');

  /* the fixture of Block 5 needs the groups of cost the social block reads */
  const BG8 = JSON.parse(JSON.stringify(BG5));
  BG8.costs.forEach(c => { c.byGroup = { labour: 12000, inputs: 18000, services: 10000 }; });
  BG8.fixedList = [];
  const P8 = Project.merge(P5, { socialRate: 0.10, rate: { mode: 'manual', manual: 0.10, manualIsReal: true } });
  const S8base = FinState.build({ longTermShare: 0, seasonalShare: 0, fee: 0 }, P8, MK5, BG8);
  const AP8 = Appraisal.build({ rateProject: null, rateEquity: null, treatments: [] }, P8, S8base);
  const neutral = Object.assign(Social.defaults(), {
    standard: 1, product: 1, labour: 1, inputs: 1, machinery: 1, services: 1, admin: 1, other: 1,
    investment: 1, exchange: 1, exportShare: 0, importShare: 0, subsidy: 0,
  });

  /* --- with every factor at 1, the only difference is the transfers --- */
  const N8 = Social.build(neutral, P8, MK5, BG8, S8base, AP8);
  check('con todos los factores en 1, el flujo económico es el privado más los impuestos',
    N8.flow.every((v, t) => near(v, S8base.projectFlow[t] + (t === 0 ? 0 : N8.rows[t - 1].taxes), 1e-6)),
    'diferencia máxima ' + fmtFixed(Math.max(...N8.flow.map((v, t) => Math.abs(v - S8base.projectFlow[t] - (t === 0 ? 0 : N8.rows[t - 1].taxes)))), 8));
  check('y el VAN económico supera al privado exactamente en el valor presente de los impuestos',
    near(N8.economic.npv - Fin.npv(0.10, S8base.projectFlow), N8.bridge.transfers, 1e-6), fmtMoney(N8.bridge.transfers, 2));
  check('sin distorsiones, las tres correcciones de precios valen cero',
    near(N8.bridge.product, 0, 1e-9) && near(N8.bridge.costs, 0, 1e-9) && near(N8.bridge.investment, 0, 1e-9));

  /* --- the bridge has to close, whatever the factors --- */
  const closes = s => {
    const m = Social.build(Object.assign(Social.defaults(), s), P8, MK5, BG8, S8base, AP8);
    const sum = m.bridge.privateAtSocial + m.bridge.transfers + m.bridge.product + m.bridge.costs + m.bridge.investment;
    return Math.abs(sum - m.economic.npv) < Math.max(1e-6, Math.abs(m.economic.npv) * 1e-9);
  };
  check('la descomposición cierra con los factores por omisión', closes({}));
  check('cierra con mano de obra barata y producto caro', closes({ labour: 0.5, product: 1.2 }));
  check('cierra con subsidio y exportación', closes({ subsidy: 8000, exportShare: 0.6, exchange: 1.15 }));
  check('cierra con insumos importados', closes({ importShare: 0.4, exchange: 1.2 }));
  check('cierra con un factor de inversión fijado a mano', closes({ investment: 0.75 }));

  /* --- what each factor does --- */
  const cheapLabour = Social.build(Object.assign(Social.defaults(), neutral, { labour: 0.5 }), P8, MK5, BG8, S8base, AP8);
  check('abaratar la mano de obra sube el VAN económico', cheapLabour.economic.npv > N8.economic.npv);
  check('y lo sube exactamente en la mitad del costo laboral, descontado',
    near(cheapLabour.economic.npv - N8.economic.npv, Fin.npv(0.10, [0].concat(N8.rows.map(r => r.labourCost * 0.5))), 1e-6));
  const better = Social.build(Object.assign(Social.defaults(), neutral, { product: 1.2 }), P8, MK5, BG8, S8base, AP8);
  check('un precio cuenta mayor que el de mercado sube el ingreso económico',
    near(better.rows[0].revenueEcon, N8.rows[0].revenue * 1.2, 1e-6));
  const subsidised = Social.build(Object.assign(Social.defaults(), neutral, { subsidy: 10000 }), P8, MK5, BG8, S8base, AP8);
  check('un subsidio recibido se descuenta del ingreso económico',
    near(subsidised.rows[0].revenueEcon, N8.rows[0].revenue - 10000, 1e-6));
  check('y el subsidio entra al puente restando, no sumando', subsidised.bridge.transfers < N8.bridge.transfers);
  const exporter = Social.build(Object.assign(Social.defaults(), neutral, { exportShare: 0.5, exchange: 1.2 }), P8, MK5, BG8, S8base, AP8);
  check('la divisa que gana una exportación vale más que el tipo de cambio oficial',
    near(exporter.rows[0].revenueEcon, N8.rows[0].revenue * (1 + 0.5 * 0.2), 1e-6));

  /* --- the conversion factor of the investment --- */
  check('el factor de la inversión se pondera según de qué está hecha', (() => {
    const budget = { summary: { byKind: { land: 100, works: 300, machinery: 100 } } };
    const f = Social.investmentFactor({ standard: 0.9, machinery: 1.0 }, budget);
    return near(f, (100 * 1 + 300 * 0.9 + 100 * 1.0) / 500, 1e-12);
  })());
  check('un factor escrito a mano manda sobre la ponderación',
    near(Social.investmentFactor({ standard: 0.9, machinery: 1, investment: 0.8 }, { summary: { byKind: { works: 100 } } }), 0.8, 1e-12));
  check('sin inversión declarada se usa el factor estándar',
    near(Social.investmentFactor({ standard: 0.85, machinery: 1 }, { summary: { byKind: {} } }), 0.85, 1e-12));

  /* --- social indicators --- */
  const withJobs = Social.build(Object.assign(Social.defaults(), neutral, { wage: 400, daysPerJob: 250 }), P8, MK5, BG8, S8base, AP8);
  check('los jornales salen del costo de mano de obra entre el jornal',
    near(withJobs.rows[0].jobs, 12000 / 400, 1e-9), fmtNum(withJobs.rows[0].jobs, 1) + ' jornales');
  check('los empleos permanentes son los jornales entre los días de un empleo',
    near(withJobs.indicators.permanentJobs, (12000 / 400) / 250, 1e-9));
  check('la inversión por empleo usa la inversión inicial completa',
    near(withJobs.indicators.investmentPerJob, BG8.summary.initial / withJobs.indicators.permanentJobs, 1e-6));
  check('sin jornal declarado no se inventan empleos',
    Social.build(Object.assign(Social.defaults(), neutral, { wage: 0 }), P8, MK5, BG8, S8base, AP8).indicators.permanentJobs === 0);

  /* the distribution of the value added has to add up to the value added */
  check('el reparto del valor agregado suma exactamente el valor agregado',
    N8.rows.every(r => near(r.wages + r.taxesPaid + r.interest + r.surplus, r.valueAdded, 1e-6)),
    'remuneraciones + impuestos + intereses + excedente');
  check('el valor agregado es la producción menos el consumo intermedio',
    near(N8.rows[0].valueAdded, 100000 - (18000 + 10000), 1e-9), fmtMoney(N8.rows[0].valueAdded, 0));
  check('las divisas netas son exportaciones menos importaciones', (() => {
    const m = Social.build(Object.assign(Social.defaults(), neutral, { exportShare: 0.5, importShare: 0.25 }), P8, MK5, BG8, S8base, AP8);
    return near(m.rows[0].fx, 100000 * 0.5 - 40000 * 0.25, 1e-9);
  })());

  /* --- coherence --- */
  check('si conviene al dueño pero no al país, se avisa', (() => {
    /* an extreme factor makes the country lose */
    const m = Social.build(Object.assign(Social.defaults(), neutral, { product: 0.3 }), P8, MK5, BG8, S8base, AP8);
    return m.economic.npv <= 0 && m.messages.some(x => /no al país|not for the country/.test(x.es + x.en));
  })());
  check('si no conviene al dueño pero sí al país, se explica como argumento de apoyo público', (() => {
    const st = JSON.parse(JSON.stringify(S8base));
    st.projectFlow = st.projectFlow.map((v, t) => (t === 0 ? v * 3 : v));
    const ap = Appraisal.build({ rateProject: null, rateEquity: null, treatments: [] }, P8, st);
    const m = Social.build(Object.assign(Social.defaults(), neutral, { labour: 0.3, inputs: 0.5, services: 0.5, investment: 0.4 }), P8, MK5, BG8, st, ap);
    return ap.project.npv < 0 && m.economic.npv > 0 && m.messages.some(x => /apoyo público|public support/.test(x.es + x.en));
  })());
  check('un factor estándar fuera de rango se cuestiona',
    Social.build(Object.assign(Social.defaults(), { standard: 0.3 }), P8, MK5, BG8, S8base, AP8)
      .messages.some(x => /fuera del rango|outside the usual range/.test(x.es + x.en)));
  check('valuar la mano de obra a su salario de mercado se señala',
    Social.build(Object.assign(Social.defaults(), { labour: 1 }), P8, MK5, BG8, S8base, AP8)
      .messages.some(x => /salario de mercado|market wage/.test(x.es + x.en)));
  check('una tasa social mayor que la privada se cuestiona', (() => {
    const p = Project.merge(P8, { socialRate: 0.25 });
    return Social.build(Social.defaults(), p, MK5, BG8, S8base, AP8).messages.some(x => /tasa social|social rate/.test(x.es + x.en));
  })());
  check('cada aviso del Bloque 8 viene en los dos idiomas',
    Social.build(Social.defaults(), P8, MK5, BG8, S8base, AP8).messages.every(x => x.es && x.en && x.level));

  /* --- the figures --- */
  check('las cuatro figuras del Bloque 8 se dibujan sin error', (() => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    document.body.appendChild(svg);
    const m = Social.build(Social.defaults(), P8, MK5, BG8, S8base, AP8);
    try {
      Plots8.drawBridge(svg, m.bridge);
      Plots8.drawProfiles(svg, m, S8base.projectFlow);
      Plots8.drawJobs(svg, m.rows, 270);
      Plots8.drawValueAdded(svg, m.rows);
      return svg.childElementCount > 0;
    } catch (e) { return false; } finally { document.body.removeChild(svg); }
  })());
  check('las figuras aguantan un proyecto sin datos sociales', (() => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    document.body.appendChild(svg);
    try {
      Plots8.drawBridge(svg, null);
      Plots8.drawJobs(svg, [], 270);
      Plots8.drawValueAdded(svg, []);
      return true;
    } catch (e) { return false; } finally { document.body.removeChild(svg); }
  })());

  /* ============================================================
     the three practice databases
     ============================================================ */
  section('Bases de datos para practicar');

  const KEYS = Object.keys(Practice.CASES);
  check('hay tres bases de datos completas', KEYS.length === 3, KEYS.join(' · '));
  check('cada una se describe y dice qué practicar con ella', KEYS.every(k => {
    const c = Practice.CASES[k];
    return c.es && c.en && c.what.length === 2 && c.teaches.length === 2 && c.what[0] && c.teaches[0];
  }));
  check('cada una trae los cinco bloques de datos', KEYS.every(k => {
    const c = Practice.CASES[k];
    return c.project && c.market && c.budget && c.finance && c.risk && c.social;
  }));
  check('cada serie tiene diez años con precio, rendimiento e índice', KEYS.every(k => {
    const s = Practice.CASES[k].market.series;
    return s.length === 10 && s.every(r => +r.year > 2000 && +r.price > 0 && +r.yield > 0 && +r.index > 0);
  }));
  check('todas dicen en sus notas que son ficticias',
    KEYS.every(k => /FICTICIO/i.test(Practice.CASES[k].project.notes || '')));

  /* --- each one becomes a project the app accepts --- */
  check('cada base produce un proyecto sin errores de coherencia', KEYS.every(k => {
    const p = Practice.toProject(k);
    return p && !Project.hasErrors(Project.validate(p));
  }), KEYS.map(k => k + ': ' + Project.validate(Practice.toProject(k)).filter(m => m.level === 'error').length + ' errores').join(' · '));
  check('los presupuestos se leen con las palabras que traen', KEYS.every(k => {
    const b = Practice.CASES[k].budget;
    return b.investments.every(i => Budget.KINDS[Budget.parseKind(i.kind)]) &&
      b.operating.every(c => Budget.GROUPS[Budget.parseGroup(c.group)] && Budget.BASES[Budget.parseBase(c.base)]);
  }));

  /* --- the whole chain runs on each one --- */
  const runCase = k => {
    const p = Practice.toProject(k);
    /* Block 3 */
    const parsed = Import.numericRows(p.market.series, ['year', 'price', 'yield', 'index']);
    const rows = parsed.rows.filter(r => r.year != null).sort((a, b) => a.year - b.year);
    const years = rows.map(r => r.year);
    const deflated = Market.deflate(years, rows.map(r => r.price), rows.map(r => r.index), p.baseYear, { inflation: p.inflation });
    const priceDesc = Market.describe(years, deflated.real);
    const yieldDesc = Market.describe(years, rows.map(r => r.yield));
    const priceFc = Market.forecast(priceDesc, { method: p.market.priceMethod, horizon: p.horizon, lastN: p.market.priceLastN });
    const yieldFc = Market.forecast(yieldDesc, { method: p.market.yieldMethod, horizon: p.horizon, lastN: p.market.yieldLastN });
    const prog = Market.programme({
      horizon: p.horizon, baseYear: p.baseYear, scale: p.scale, gestation: p.gestation, ramp: p.ramp,
      yieldFull: yieldFc.values[yieldFc.values.length - 1].value,
      yieldByYear: yieldFc.values.map((v, i) => v.value * Market.yieldShare(i + 1, p.gestation, p.ramp)),
      priceByYear: priceFc.values.map(v => v.value),
      loss: p.market.loss, soldShare: p.market.soldShare,
      channels: (p.market.channels || []).map(c => ({ share: parseNum(c.share), factor: parseNum(c.factor) })),
      byproducts: (p.market.byproducts || []).map(b => ({ perUnit: parseNum(b.perUnit), price: parseNum(b.price) })),
      otherIncome: p.market.otherIncome,
    });
    const market = { prog, priceFc, yieldFc, priceDesc, yieldDesc, deflated };
    /* Block 4 */
    const budget = Budget.build({
      investments: p.budget.investments.map(r => ({ name: r.name, kind: r.kind, qty: parseNum(r.qty), unitCost: parseNum(r.unitCost), year: parseNum(r.year), life: parseNum(r.life), salvagePct: (parseNum(r.salvagePct) || 0) / 100, replace: r.replace })),
      deferred: p.budget.deferred.map(r => ({ name: r.name, amount: parseNum(r.amount), year: parseNum(r.year) })),
      deferredLife: p.budget.deferredLife,
      establishment: p.budget.establishment.map(r => ({ group: r.group, base: r.base, qty: parseNum(r.qty), unitCost: parseNum(r.unitCost) })),
      operating: p.budget.operating.map(r => ({ group: r.group, base: r.base, qty: parseNum(r.qty), unitCost: parseNum(r.unitCost) })),
      fixed: p.budget.fixed.map(r => ({ name: r.name, amount: parseNum(r.amount) })),
      wcMethod: p.budget.wcMethod, wcDaysInventory: p.budget.wcDaysInventory,
      wcDaysReceivable: p.budget.wcDaysReceivable, wcDaysPayable: p.budget.wcDaysPayable,
    }, p, market);
    /* Blocks 5, 6, 8 */
    const st = FinState.build(p.finance, p, market, budget);
    const ap = Appraisal.build(p.appraisal || { rateProject: null, rateEquity: null, treatments: [] }, p, st);
    const so = Social.build(p.social, p, market, budget, st, ap);
    return { p, market, budget, st, ap, so };
  };
  const RUN = {};
  KEYS.forEach(k => { RUN[k] = runCase(k); });

  check('la cadena completa corre en las tres sin ningún error', KEYS.every(k => {
    const r = RUN[k];
    return ![r.market.prog && [], r.budget.messages, r.st.messages, r.ap.messages, r.so.messages]
      .filter(Array.isArray).some(list => list.some(m => m.level === 'error'));
  }));
  check('el balance general cuadra en las tres', KEYS.every(k => RUN[k].st.balance.every(b => Math.abs(b.gap || 0) < 1)),
    KEYS.map(k => k + ' ' + fmtFixed(Math.max(...RUN[k].st.balance.map(b => Math.abs(b.gap || 0))), 6)).join(' · '));
  check('el puente del Bloque 8 cierra en las tres', KEYS.every(k => {
    const b = RUN[k].so.bridge;
    return Math.abs((b.privateAtSocial + b.transfers + b.product + b.costs + b.investment) - b.economic) < 1;
  }));
  check('la descomposición del VAN del Bloque 6 cuadra en las tres', KEYS.every(k => {
    const a = RUN[k].ap.parts;
    return near(a.revenue - a.cost - a.tax - a.investment + a.salvage, RUN[k].ap.project.npv, 1e-5);
  }));
  check('el reconstructor rápido del Bloque 7 reproduce el flujo en las tres', KEYS.every(k => {
    const r = RUN[k];
    const base = Risk.baseline(r.p, r.market, r.budget, Object.assign({}, r.st, { rateProject: r.ap.rateProject }));
    return Risk.rebuild(base, {}).flow.every((v, i) => near(v, r.st.projectFlow[i], 1e-6));
  }));

  /* --- each case has to strain where its description says --- */
  check('las tres son viables: VAN positivo a su propia tasa', KEYS.every(k => RUN[k].ap.project.npv > 0),
    KEYS.map(k => k + ' ' + fmtMoney(RUN[k].ap.project.npv, 0)).join(' · '));
  check('el nopal es el caso limpio: produce desde el primer año y recupera pronto',
    RUN.nopal.p.gestation === 0 && RUN.nopal.ap.project.discountedPayback < 6,
    'recuperación ' + fmtFixed(RUN.nopal.ap.project.discountedPayback, 1) + ' años');
  check('el café tensiona la gestación: tres años sin cosecha y caja negativa',
    RUN.cafe.p.gestation === 3 && RUN.cafe.market.prog.rows.slice(0, 3).every(r => r.revenue === 0) && RUN.cafe.st.cashLow < 0);
  check('y su crédito trae gracia al menos igual a la gestación',
    RUN.cafe.p.finance.longTermGrace >= RUN.cafe.p.gestation);
  check('el café exporta, así que el Bloque 8 le reconoce divisas',
    RUN.cafe.so.indicators.fxPresent > 0, fmtMoney(RUN.cafe.so.indicators.fxPresent, 0));
  check('la fresa es el caso de la caja: rentable pero sin dinero el primer año',
    RUN.fresa.ap.project.npv > 0 && RUN.fresa.st.cashLow < 0,
    'caja ' + fmtMoney(RUN.fresa.st.cashLow, 0) + ' en ' + RUN.fresa.st.cashLowYear);
  check('la fresa lleva el crédito más pesado de las tres',
    RUN.fresa.p.finance.longTermShare >= RUN.cafe.p.finance.longTermShare &&
    RUN.fresa.p.finance.longTermShare >= RUN.nopal.p.finance.longTermShare);
  check('las tres usan los cuatro modos de tasa entre ellas',
    new Set(KEYS.map(k => RUN[k].p.rate.mode)).size >= 3,
    KEYS.map(k => k + ': ' + RUN[k].p.rate.mode).join(' · '));

  /* --- loading into the app --- */
  check('cargar una base deja el proyecto en el estado de la app', (() => {
    const savedProject = (() => { try { return localStorage.getItem(Project.KEY); } catch (e) { return null; } })();
    const before = state.project;
    const p = Practice.load('nopal');
    const ok = state.project === p && /nopal/i.test(p.name) && p.market.series.length === 10 && p.budget.investments.length > 0;
    state.project = before;
    try { savedProject == null ? localStorage.removeItem(Project.KEY) : localStorage.setItem(Project.KEY, savedProject); } catch (e) { /* ignore */ }
    return ok;
  })());
  check('cargar una base avisa a todos los bloques con un solo evento', (() => {
    let heard = 0;
    const listener = () => { heard++; };
    document.addEventListener('projectloaded', listener);
    const before = state.project;
    Practice.load('cafe');
    document.removeEventListener('projectloaded', listener);
    state.project = before;
    return heard === 1;
  })());
  check('las escalas y los lugares son distintos entre las tres',
    new Set(KEYS.map(k => Practice.CASES[k].project.location)).size === 3 &&
    new Set(KEYS.map(k => Practice.CASES[k].project.kind)).size >= 2);

  /* ============================================================
     comparison and decisions (Block 9)
     ============================================================ */
  section('Comparación y decisiones (Bloque 9)');

  /* --- the flow of an alternative described with four figures --- */
  check('la alternativa de cuatro cifras se vuelve un flujo', (() => {
    const f = Decide.flowOf({ investment: 1000, net: 300, horizon: 5, salvage: 200 });
    return f.length === 6 && f[0] === -1000 && f[1] === 300 && f[4] === 300 && f[5] === 500;
  })());
  check('el crecimiento anual se aplica desde el segundo año', (() => {
    const f = Decide.flowOf({ investment: 100, net: 100, horizon: 3, growth: 0.10 });
    return near(f[1], 100) && near(f[2], 110) && near(f[3], 121);
  })());
  check('un flujo propio pasa tal cual', (() => {
    const f = Decide.flowOf({ flow: [-500, 200, 200, 200] });
    return f.length === 4 && f[0] === -500;
  })());

  /* --- the indicators of each alternative: 300 a year for 5 years at 10 %,
         the textbook annuity 3.790787 --- */
  const A9 = Decide.appraise([
    { name: 'chica', investment: 1000, net: 300, horizon: 5 },
    { name: 'grande', investment: 2000, net: 550, horizon: 5 },
  ], 0.10);
  check('el VAN de una alternativa usa el factor de anualidad de las tablas',
    near(A9[0].npv, 300 * 3.7907868 - 1000, 1e-3), fmtFixed(A9[0].npv, 4));
  check('su TIR resuelve la anualidad', near(A9[0].irr, 0.1523, 1e-3), fmtPct(A9[0].irr, 3));
  check('el valor anual equivalente es el VAN por el factor de recuperación de capital',
    near(A9[0].eaa, A9[0].npv * Fin.capitalRecovery(0.10, 5), 1e-9));
  check('el índice de rentabilidad es el valor presente de los ingresos entre la inversión',
    near(A9[0].pi, (A9[0].npv + 1000) / 1000, 1e-9), fmtFixed(A9[0].pi, 4));

  /* --- the incremental IRR: the extra 1000 returns 250 a year for five years,
         an annuity factor of 4, which is 7.93 % --- */
  const C9 = Decide.compare(A9[0], A9[1], 0.10);
  check('la diferencia se toma de la más barata a la más cara',
    C9.small === A9[0] && C9.large === A9[1] && near(C9.extraInvestment, 1000));
  check('la TIR incremental resuelve la anualidad de la diferencia',
    near(C9.incrementalIRR, 0.07931, 1e-4), fmtPct(C9.incrementalIRR, 3));
  check('en el cruce de Fisher las dos valen lo mismo', (() => {
    const r = C9.incrementalIRR;
    return near(Fin.npv(r, C9.small.flow), Fin.npv(r, C9.large.flow), 1e-6);
  })());
  check('arriba del cruce gana la barata y abajo gana la cara', (() => {
    const above = Decide.compare(A9[0], A9[1], 0.10);
    const belowList = Decide.appraise([
      { name: 'chica', investment: 1000, net: 300, horizon: 5 },
      { name: 'grande', investment: 2000, net: 550, horizon: 5 },
    ], 0.05);
    const below = Decide.compare(belowList[0], belowList[1], 0.05);
    return above.winner === above.small && below.winner === below.large;
  })());
  check('la TIR y el VAN pueden desacordar, y el aviso lo dice', (() => {
    /* abajo del cruce de Fisher el VAN prefiere la grande y la TIR la chica */
    const alts = Decide.appraise([
      { name: 'chica', investment: 1000, net: 300, horizon: 5 },
      { name: 'grande', investment: 2000, net: 550, horizon: 5 },
    ], 0.05);
    const msgs = Decide.validate({ alternatives: alts, comparison: Decide.compare(alts[0], alts[1], 0.05) }, 0.05);
    return alts[0].irr > alts[1].irr && alts[1].npv > alts[0].npv &&
      msgs.some(x => /TIR incremental|incremental IRR/.test(x.es + x.en));
  })());

  /* --- different horizons: the NPV lies and the equivalent annual value does not --- */
  const H9 = Decide.appraise([
    { name: 'huerto 20 años', investment: 1000, net: 165, horizon: 20 },
    { name: 'invernadero 8 años', investment: 1000, net: 244, horizon: 8 },
  ], 0.10);
  check('con horizontes distintos el VAN prefiere uno y el valor anual equivalente el otro',
    H9[0].npv > H9[1].npv && H9[1].eaa > H9[0].eaa,
    `VAN ${fmtFixed(H9[0].npv, 0)} vs ${fmtFixed(H9[1].npv, 0)} · VAE ${fmtFixed(H9[0].eaa, 0)} vs ${fmtFixed(H9[1].eaa, 0)}`);
  check('y el bloque avisa que ahí manda el valor anual equivalente',
    Decide.validate({ alternatives: H9 }, 0.10).some(x => /valor anual equivalente|equivalent annual value/.test(x.es + x.en)));

  /* --- capital rationing: the case where the rule of thumb is not the best --- */
  const R9 = Decide.rationing([
    { name: 'A', flow: [-60, 110] },
    { name: 'B', flow: [-50, 90] },
    { name: 'C', flow: [-50, 89] },
  ], 100, 0);
  check('la regla de dedo ordena por índice de rentabilidad',
    R9.greedy.length === 1 && R9.greedy[0].name === 'A' && near(R9.greedyNpv, 50));
  check('la búsqueda exhaustiva encuentra el paquete que la regla no ve',
    R9.best.pick.length === 2 && near(R9.best.npv, 79) && near(R9.best.cost, 100),
    R9.best.pick.map(x => x.name).join('+'));
  check('y reporta cuánto VAN dejó la regla sobre la mesa', near(R9.loss, 29), fmtFixed(R9.loss, 2));
  check('ningún paquete se pasa del presupuesto',
    R9.best.cost <= R9.budget + 1e-9 && R9.greedyCost <= R9.budget + 1e-9);
  check('cuando la regla sí acierta, la pérdida es cero', (() => {
    const r = Decide.rationing([{ name: 'A', flow: [-40, 90] }, { name: 'B', flow: [-40, 80] }], 100, 0);
    return near(r.loss, 0) && r.greedy.length === 2;
  })());
  check('una alternativa con VAN negativo no entra en la regla de dedo', (() => {
    const r = Decide.rationing([{ name: 'A', flow: [-40, 90] }, { name: 'mala', flow: [-10, 5] }], 100, 0);
    return !r.greedy.some(x => x.name === 'mala') && !r.best.pick.some(x => x.name === 'mala');
  })());

  /* --- replacement: the equivalent annual cost of keeping the machine --- */
  const RP9 = Decide.replacement({ cost: 100000, decline: 0.20, floorValue: 0, running: 10000, rise: 0.10, maxLife: 12, rate: 0.10 });
  check('el costo anual equivalente del primer año se calcula a mano',
    near(RP9.rows[0].eac, 40000, 1e-6), fmtFixed(RP9.rows[0].eac, 4));
  check('sus dos partes suman el costo anual equivalente',
    RP9.rows.every(x => near(x.capital + x.running, x.eac, 1e-6)));
  check('la parte de capital baja y la de operación sube', (() => {

  check('el .zip se puede volver a leer: nombres, número de archivos y CRC', await (async () => {

      { name: 'tablas/costos.csv', data: 'ano,costo\n2027,1000\n' },
    ]);
    const buf = new Uint8Array(await z.arrayBuffer());
    const dv = new DataView(buf.buffer);
    let eocd = -1;
    for (let i = buf.length - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) return false;
    const n = dv.getUint16(eocd + 10, true);
    const cd = dv.getUint32(eocd + 16, true);
    const names = [];
    let p = cd;
    for (let k = 0; k < n; k++) {
      const nl = dv.getUint16(p + 28, true);
      names.push(new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nl)));
      p += 46 + nl + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
    }
    const crcStored = dv.getUint32(cd + 16, true);
    const crcReal = Zip.crc32(new TextEncoder().encode('evaluación económica'));
    return n === 2 && names[0] === 'informe.html' && names[1] === 'tablas/costos.csv' && crcStored === crcReal;
  })());

  })());

  document.getElementById('sum').innerHTML = fail === 0
    ? `<span class="ok">${pass} pruebas, todas pasan</span>`
    : `<span class="bad">${fail} fallan</span> de ${pass + fail}`;
})();
</script>
</body>
</html>
